<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#17212b" />
    <meta name="apple-mobile-web-app-title" content="Flight Briefing" />
    <title>Flight Briefing App</title>
  </head>
  <body>
    <div id="root">
      <section id="app-loading" style="max-width:560px;margin:48px auto;padding:24px;font-family:Arial,sans-serif;color:#17212b">
        <h1>Flight Briefing App</h1>
        <p id="app-loading-message" role="status">Loading your flight briefing…</p>
        <button id="app-reload" type="button" hidden style="padding:12px 18px;font-size:16px">Reload app</button>
        <p id="app-reload-note" hidden>Your saved flight will be kept on this device.</p>
      </section>
    </div>
    <script src="%BASE_URL%app-recovery.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
